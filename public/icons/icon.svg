  />
  <!-- Left Prism Machined Plate Accent -->
  <path
    d="M148 180L180 148H212L194 214L148 238V180Z"
    fill="#FFFFFF"
    fill-opacity="0.22"
  />

  <!-- Colliding Right Energy Prism (Plasma Coral) -->
  <path
    d="M388 166L340 118H272L300 224L358 256L300 288L272 394H340L388 346V166Z"
