  <!-- Diagonal Clash Lightning Seam -->
  <path
    d="M276 92L242 204H282L236 420"
    stroke="#FEF08A"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-opacity="0.88"
  />

  <!-- Signature Hexagonal Energy Core -->
  <polygon
    points="256,184 318,220 318,292 256,328 194,292 194,220"
    fill="#12182B"
    stroke="url(#hexCore)"
    stroke-width="10"
    stroke-linejoin="round"
  />
  <polygon
    points="256,210 296,233 296,279 256,302 216,279 216,233"
