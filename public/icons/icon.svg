    fill-opacity="0.72"
    stroke="url(#shieldRim)"
    stroke-width="10"
    stroke-linejoin="round"
  />
  <path
    d="M168 74H344L438 168V344L344 438H168L74 344V168L168 74Z"
    stroke="#FFFFFF"
    stroke-opacity="0.14"
    stroke-width="3"
  />

  <!-- Colliding Left Energy Prism (Electric Teal) -->
  <path
    d="M124 166L172 118H240L212 224L154 256L212 288L240 394H172L124 346V166Z"
