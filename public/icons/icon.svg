<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1122"/>
      <stop offset="55%" stop-color="#070A14"/>
      <stop offset="100%" stop-color="#140A1E"/>
    </linearGradient>
    <linearGradient id="shieldRim" x1="64" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5C3"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#FF3B7B"/>
    </linearGradient>
    <linearGradient id="leftShard" x1="88" y1="120" x2="256" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="48%" stop-color="#00D4C8"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="rightShard" x1="256" y1="120" x2="424" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF85B3"/>
      <stop offset="48%" stop-color="#FF3B7B"/>
      <stop offset="100%" stop-color="#9D174D"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="256" cy="256" r="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#F59E0B" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hexCore" x1="204" y1="196" x2="308" y2="316" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="42%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Deep Arena Chassis -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>

  <!-- Subtle Geometric Grid Accent -->
  <g stroke="#38BDF8" stroke-opacity="0.09" stroke-width="2">
    <path d="M128 48V464M256 48V464M384 48V464M48 128H464M48 256H464M48 384H464"/>
  </g>

  <!-- Chamfered Octagonal Arena Crest Frame -->
  <path
    d="M156 54H356L458 156V356L356 458H156L54 356V156L156 54Z"
